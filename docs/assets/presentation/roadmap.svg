<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title description"><title id="title">DuckOS provisional direction</title><desc id="description">Published beta.2 is the current foundation. Future directions are deeper operator workflows and broader deployment. No dates or completed future releases are promised.</desc><rect width="1120" height="340" rx="20" fill="#0d1c27"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="44" fill="#a9c1c7" font-size="18" letter-spacing="2">DIRECTION, NOT A DELIVERY SCHEDULE</text><rect x="36" y="76" width="300" height="212" rx="12" fill="#172e3a" stroke="#32535f"/><rect x="36" y="76" width="300" height="4" rx="2" fill="#83d9c2"/><text x="54" y="116" font-size="18" fill="#83d9c2" letter-spacing="1">01 / PUBLISHED</text><text x="54" y="154" font-size="25" font-weight="700" fill="#eef5f5">Beta.2 foundation</text><text x="54" y="197" font-size="18" fill="#b5cdd0">Local control + bounded launchers</text><text x="54" y="226" font-size="18" fill="#b5cdd0">AMD64 live evidence</text><text x="54" y="255" font-size="18" fill="#b5cdd0">Three verified build targets</text><rect x="410" y="76" width="300" height="212" rx="12" fill="#172e3a" stroke="#32535f"/><rect x="410" y="76" width="300" height="4" rx="2" fill="#e9c765"/><text x="428" y="116" font-size="18" fill="#e9c765" letter-spacing="1">02 / PROVISIONAL</text><text x="428" y="154" font-size="25" font-weight="700" fill="#eef5f5">Deeper workflows</text><text x="428" y="197" font-size="18" fill="#b5cdd0">Network + VPN policy</text><text x="428" y="226" font-size="18" fill="#b5cdd0">Port Mapping protocols</text><text x="428" y="255" font-size="18" fill="#b5cdd0">Multi-WAN · QoS · Wi-Fi</text><rect x="784" y="76" width="300" height="212" rx="12" fill="#172e3a" stroke="#32535f"/><rect x="784" y="76" width="300" height="4" rx="2" fill="#a9c1c7"/><text x="802" y="116" font-size="18" fill="#a9c1c7" letter-spacing="1">03 / PROVISIONAL</text><text x="802" y="154" font-size="25" font-weight="700" fill="#eef5f5">Broader deployment</text><text x="802" y="197" font-size="18" fill="#b5cdd0">OTA delivery + recovery</text><text x="802" y="226" font-size="18" fill="#b5cdd0">System image exploration</text><text x="802" y="255" font-size="18" fill="#b5cdd0">Native hardware qualification</text><path d="M350 180h34m-9-7 9 7-9 7" fill="none" stroke="#7ca69f" stroke-width="2"/><path d="M724 180h34m-9-7 9 7-9 7" fill="none" stroke="#7ca69f" stroke-width="2"/><text x="36" y="319" font-size="16" fill="#8cabb5">Existing foundations do not imply a complete, qualified operator workflow. Scope may change.</text></g></svg>