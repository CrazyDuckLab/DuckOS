<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title description"><title id="title">DuckOS control plane and privilege boundaries</title><desc id="description">Easy and Full Web UI, source-built CLI and automation call the authenticated API and Engine. The Agent uses private IPC and zero capabilities. WireGuard and FRR have separate bounded launchers; Xray uses Vault materialization. Linux handles packet processing.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#77d3c0"/></marker></defs><rect width="1120" height="770" rx="20" fill="#0d1c27"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="49" font-size="18" fill="#8cbdc1" font-weight="700" text-anchor="start">ONE MODEL. THREE WAYS IN.</text><text x="40" y="82" font-size="31" fill="#f0f5f4" font-weight="700" text-anchor="start">Control is local. Privilege is explicit.</text><rect x="40" y="112" width="320" height="86" rx="12" fill="#172e3a" stroke="#32535f" stroke-dasharray=""/><text x="60" y="146" font-size="24" fill="#eef5f5" font-weight="700" text-anchor="start">Web UI</text><text x="60" y="174" font-size="18" fill="#a9c1c7" font-weight="400" text-anchor="start">Easy + Full modes</text><rect x="400" y="112" width="320" height="86" rx="12" fill="#172e3a" stroke="#32535f" stroke-dasharray=""/><text x="420" y="146" font-size="24" fill="#eef5f5" font-weight="700" text-anchor="start">Duck CLI</text><text x="420" y="174" font-size="18" fill="#a9c1c7" font-weight="400" text-anchor="start">Source-built in beta.2</text><rect x="760" y="112" width="320" height="86" rx="12" fill="#172e3a" stroke="#32535f" stroke-dasharray=""/><text x="780" y="146" font-size="24" fill="#eef5f5" font-weight="700" text-anchor="start">Automation</text><text x="780" y="174" font-size="18" fill="#a9c1c7" font-weight="400" text-anchor="start">Authenticated public API</text><path d="M200 198V221H560V245" fill="none" stroke="#77d3c0" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 198V221H560V245" fill="none" stroke="#77d3c0" stroke-width="2" marker-end="url(#arrow)"/><path d="M920 198V221H560V245" fill="none" stroke="#77d3c0" stroke-width="2" marker-end="url(#arrow)"/><rect x="290" y="245" width="540" height="86" rx="12" fill="#153d3d" stroke="#4aa892" stroke-dasharray=""/><text x="560" y="280" font-size="26" fill="#eef5f5" font-weight="700" text-anchor="middle">API / Engine</text><text x="560" y="308" font-size="18" fill="#b4d8d2" font-weight="400" text-anchor="middle">Identity · RBAC · intent · validation · transactions</text><path d="M560 331V378" fill="none" stroke="#77d3c0" stroke-width="2" marker-end="url(#arrow)"/><text x="580" y="362" font-size="17" fill="#83d9c2" font-weight="400" text-anchor="start">Private authenticated IPC</text><rect x="290" y="378" width="540" height="86" rx="12" fill="#172e3a" stroke="#32535f" stroke-dasharray=""/><text x="560" y="413" font-size="26" fill="#eef5f5" font-weight="700" text-anchor="middle">duck-agent</text><text x="560" y="442" font-size="18" fill="#e9c765" font-weight="400" text-anchor="middle">Bounded operations · ZERO effective capabilities</text><path d="M560 464V489H200V516" fill="none" stroke="#77d3c0" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 464V489H560V516" fill="none" stroke="#77d3c0" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 464V489H920V516" fill="none" stroke="#77d3c0" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="516" width="320" height="86" rx="12" fill="#172e3a" stroke="#32535f" stroke-dasharray=""/><text x="60" y="551" font-size="23" fill="#eef5f5" font-weight="700" text-anchor="start">WireGuard launcher</text><text x="60" y="578" font-size="18" fill="#a9c1c7" font-weight="400" text-anchor="start">CAP_NET_ADMIN only</text><rect x="400" y="516" width="320" height="86" rx="12" fill="#172e3a" stroke="#32535f" stroke-dasharray=""/><text x="420" y="551" font-size="23" fill="#eef5f5" font-weight="700" text-anchor="start">FRR launcher</text><text x="420" y="578" font-size="18" fill="#a9c1c7" font-weight="400" text-anchor="start">Scoped daemon lifecycle</text><rect x="760" y="516" width="320" height="86" rx="12" fill="#172e3a" stroke="#32535f" stroke-dasharray=""/><text x="780" y="551" font-size="23" fill="#eef5f5" font-weight="700" text-anchor="start">Xray runtime</text><text x="780" y="578" font-size="18" fill="#a9c1c7" font-weight="400" text-anchor="start">Vault → config → process</text><path d="M200 602V638H380V660" fill="none" stroke="#77d3c0" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 602V638H380V660" fill="none" stroke="#77d3c0" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="660" width="680" height="68" rx="12" fill="#153d3d" stroke="#4aa892" stroke-dasharray=""/><text x="380" y="689" font-size="22" fill="#eef5f5" font-weight="700" text-anchor="middle">Linux kernel &amp; managed networking</text><text x="380" y="712" font-size="17" fill="#b4d8d2" font-weight="400" text-anchor="middle">WireGuard interfaces · FRR routes / FIB · adapters</text><rect x="760" y="660" width="320" height="68" rx="12" fill="#172e3a" stroke="#32535f" stroke-dasharray=""/><path d="M920 602V660" fill="none" stroke="#77d3c0" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="689" font-size="21" fill="#eef5f5" font-weight="700" text-anchor="middle">Xray user-space traffic</text><text x="920" y="712" font-size="17" fill="#a9c1c7" font-weight="400" text-anchor="middle">VLESS / TLS / REALITY</text><text x="40" y="751" font-size="16" fill="#98b4bc" font-weight="400" text-anchor="start">Control dependencies shown. Packet paths differ by subsystem. Browser never calls Agent IPC.</text></g></svg>